name: Feature request
description: Describe a use case and a proposed improvement.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Use case
      description: What are you trying to accomplish, and what limits the current implementation?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the desired result and how it could be verified.
    validations:
      required: true
