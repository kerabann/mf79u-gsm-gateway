name: Firmware
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firmware-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: false
      - name: Build, test, audit and package through the same Makefile
        run: make ci
      - name: Upload complete overlay and checksums
        uses: actions/upload-artifact@v4
        with:
          name: mf79u-gateway-${{ github.sha }}
          path: |
            dist/mf79u-gateway.tar.gz
            dist/manifest.json
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - name: Upload non-secret test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mf79u-checks-${{ github.sha }}
          path: reports/*.json
          if-no-files-found: ignore
          retention-days: 14
