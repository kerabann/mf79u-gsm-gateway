<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
  <title id="title">MF79U gateway: SIM voice and SMS connected to SIP</title>
  <desc id="desc">An admin browser manages Control. A PBX or one SIP phone connects to the on-device SIP gateway. The native controller owns IMS and GSM CS. LTE and GSM reach the operator directly; VoWiFi reaches IMS through an ePDG tunnel over Wi-Fi or USB. Simplified design, not a captured network trace.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#557394"/></marker>
    <style>text{font-family:Arial,Helvetica,sans-serif;fill:#16324d}.k{font-size:13px;letter-spacing:1.8px;fill:#53708e}.h{font-size:22px;font-weight:700}.s{font-size:16px;fill:#53708e}.l{fill:none;stroke:#557394;stroke-width:2;marker-end:url(#arrow)}.both{marker-start:url(#arrow)}.box{fill:#fff;stroke:#d4e0ed;stroke-width:1.5}</style>
  </defs>
  <rect width="1200" height="580" rx="16" fill="#f3f6fb"/>
  <text x="40" y="44" class="k">CONNECTION OVERVIEW</text>
  <rect x="340" y="82" width="520" height="416" rx="18" fill="#e8f0fb" stroke="#a9c2e3" stroke-width="1.5"/>
  <text x="372" y="122" class="h">ZTE MF79U · B03</text><text x="372" y="147" class="s">Autonomous runtime on the modem</text>
  <rect x="40" y="170" width="240" height="96" rx="12" class="box"/>
  <text x="64" y="207" class="h">Admin browser</text><text x="64" y="234" class="s">Embedded WebUI / REST</text>
  <rect x="40" y="342" width="240" height="116" rx="12" class="box"/>
  <text x="64" y="378" class="h">PBX or SIP phone</text><text x="64" y="406" class="s">Asterisk / MikoPBX trunk</text><text x="64" y="432" class="s">or one registered client</text>
  <rect x="372" y="174" width="190" height="100" rx="12" class="box"/>
  <text x="390" y="210" class="h">Control</text><text x="390" y="237" class="s">Settings · network</text><text x="390" y="258" class="s">SMS · system</text>
  <rect x="594" y="174" width="234" height="100" rx="12" class="box"/>
  <text x="612" y="210" class="h">Native controller</text><text x="612" y="237" class="s">SIM / AKA · registration</text><text x="612" y="258" class="s">Call policy · supervision</text>
  <rect x="372" y="342" width="190" height="116" rx="12" class="box"/>
  <text x="390" y="378" class="h">SIP gateway</text><text x="390" y="406" class="s">Trunk / registrar</text><text x="390" y="432" class="s">Codecs · SIP SMS</text>
  <rect x="594" y="342" width="234" height="116" rx="12" class="box"/>
  <text x="612" y="378" class="h">Voice backends</text><text x="612" y="406" class="s">IMS / AMR media</text><text x="612" y="432" class="s">GSM CS / 8 kHz bridge</text>
  <path d="M280 224H364" class="l"/><path d="M562 224H586" class="l"/>
  <path d="M280 400H364" class="l both"/><path d="M564 400H592" class="l both"/>
  <path d="M711 274V334" class="l"/><text x="372" y="316" class="s">Audio: PCM16LE · 16 kHz / 20 ms</text>
  <rect x="930" y="174" width="230" height="100" rx="12" class="box"/>
  <text x="950" y="210" class="h">Mobile operator</text><text x="950" y="237" class="s">LTE IMS / VoLTE</text><text x="950" y="258" class="s">GSM voice and SMS</text>
  <rect x="930" y="342" width="230" height="116" rx="12" class="box"/>
  <text x="950" y="378" class="h">ePDG / IMS</text><text x="950" y="406" class="s">VoWiFi · EAP-AKA</text><text x="950" y="432" class="s">Internet via Wi-Fi / USB</text>
  <path d="M836 400H922" class="l both"/><path d="M828 368H886V224H922" class="l both"/>
  <text x="40" y="537" class="s">Simplified design · media and control paths grouped · no host relay during normal operation</text>
</svg>
